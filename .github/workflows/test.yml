name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  POSTGRES_VERSION: "15"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-mock pytest-cov pytest-xdist faker factory-boy
    
    - name: Set up test environment
      run: |
        cp .env.example .env.test
        echo "ENVIRONMENT=test" >> .env.test
        echo "DATABASE_URL=postgresql://test:test@localhost:5432/test_db" >> .env.test
        echo "REDIS_URL=redis://localhost:6379/0" >> .env.test
        echo "SECRET_KEY=test-secret-key-for-ci" >> .env.test
        echo "MASTER_ENCRYPTION_KEY=test-master-key-for-ci" >> .env.test
    
    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
      run: |
        # Create migrations directory if it doesn't exist
        mkdir -p migrations
        # Run any SQL migration files
        for file in migrations/*.sql; do
          if [ -f "$file" ]; then
            psql $DATABASE_URL -f "$file"
          fi
        done
    
    - name: Run tests with coverage
      env:
        ENVIRONMENT: test
        DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-for-ci
        MASTER_ENCRYPTION_KEY: test-master-key-for-ci
      run: |
        pytest \
          --cov=app \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml \
          --cov-fail-under=80 \
          -v \
          --tb=short \
          -n auto
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8 mypy
    
    - name: Run Black
      run: black --check app tests
    
    - name: Run isort
      run: isort --check-only app tests
    
    - name: Run Flake8
      run: flake8 app tests --max-line-length=120 --extend-ignore=E203,W503
    
    - name: Run MyPy
      run: mypy app --ignore-missing-imports

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        severity: 'CRITICAL,HIGH'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'